# $schema: https://json.schemastore.org/spring-boot-application-properties.json
server:
  port: 8080

spring:
  application:
    name: el-seeker
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID:NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET:NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET:KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
              - profile_image
          # Apple 은 client-id / client-secret 을 여기서 주지 않는다. 둘 다 반드시 같은
          # Services ID 를 가리켜야 하므로 el-seeker.apple.* 을 단일 정본으로 삼아
          # AppleOAuthConfig 가 요청 시점에 함께 주입한다. 아래 값은 자리표시자일 뿐이다.
          apple:
            client-id: unused-overridden-at-runtime
            client-secret: unused-generated-at-runtime
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Apple
            scope:
              - openid
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          # Apple 은 userinfo 엔드포인트가 없다. 사용자 정보는 id_token 클레임에서만 나오므로
          # user-info-uri 를 두지 않고 jwk-set-uri 로 id_token 서명을 검증한다.
          # issuer-uri 는 일부러 두지 않는다. 이 값이 있으면 Boot 가 기동 시 OIDC discovery 를
          # 호출해 Apple 서버에 대한 기동 의존성이 생긴다. issuer 는 AppleOAuthConfig 에서
          # registration 을 만들 때 직접 넣는다(검증은 유지, 기동 의존성은 제거).
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        jdbc:
          time_zone: UTC
    # defer-datasource-initialization: false  # true로 설정하면 JPA 실행 후 sql 실행
  cloud:
    gcp:
      project-id: seek-web-project

el-seeker:
  jwt:
    secret: ${JWT_SECRET_BASE64}
    access-token-ttl: 1h
    refresh-token-ttl: 14d
    signup-token-ttl: 30m
  api:
    base-url: ${EL_SEEKER_API_BASE_URL:http://localhost:8080}
    api-key: ${EL_SEEKER_API_KEY:TEST_API_KEY}
  # Apple 로그인. 네 값이 모두 있어야 활성화되고, 하나라도 비면 Apple 로그인만 비활성화된다.
  # APPLE_PRIVATE_KEY 는 .p8 파일 내용 전체(PEM). 개행이 \n 리터럴이어도 처리된다.
  apple:
    client-id: ${APPLE_CLIENT_ID:}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
    # 서버-대-서버 알림 JWT 의 aud 허용 목록(쉼표 구분). 알림 엔드포인트는 primary App ID 에만
    # 등록할 수 있어, Apple 이 웹 로그인용 Services ID 가 아니라 App ID 를 aud 로 보낼 수 있다.
    # 비워 두면 client-id 만 허용한다. 값이 다르면 검증 실패 로그에 수신한 aud 가 찍힌다.
    notification-audiences: ${APPLE_NOTIFICATION_AUDIENCES:}

springdoc:
  api-docs:
    enabled: true
    groups:
      enabled: false
  swagger-ui:
    enabled: true
    groups-order: ASC
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  cache:
    disabled: true
  model-and-view-allowed: true
