<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>미매칭 후보 | ElSeeker</title>
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin/admin.css?v=5.1" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
    <aside th:replace="~{admin/fragments/admin-sidebar :: sidebar}"></aside>
    <div class="admin-sidebar-overlay" data-admin-sidebar-close></div>
    <main class="admin-content">
        <div class="admin-topbar">
            <button class="admin-sidebar-toggle" type="button" aria-label="메뉴 열기" data-admin-sidebar-toggle>
                <span></span>
            </button>
            <span class="admin-topbar-title">관리자</span>
        </div>
        <div class="admin-breadcrumb">미매칭 후보</div>
        <h2>미매칭 후보</h2>
        <p class="text-muted small">
            본문에는 있으나 어휘에 없는 단어입니다. 이 화면이 어휘를 키우는 주 입구입니다.
            <br>책을 지정하지 않으면 번역본 전체를 훑으므로 <strong>수 초</strong>가 걸립니다.
            결과는 저장하지 않고 요청할 때마다 계산합니다.
        </p>

        <form class="admin-form" method="get" action="/web/admin/bible/word-candidates">
            <div class="form-group">
                <label for="translationId">번역본</label>
                <select id="translationId" name="translationId">
                    <option value="">선택하세요</option>
                    <option th:each="t : ${translations}" th:value="${t.id}" th:text="${t.name}"
                            th:selected="${t.id == selectedTranslationId}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="bookOrder">책 순서 (비우면 전체)</label>
                <input type="number" id="bookOrder" name="bookOrder" th:value="${bookOrder}">
            </div>
            <div class="admin-form-actions">
                <button type="submit" class="btn btn-primary btn-sm">화면 이동</button>
                <button type="button" class="btn btn-outline-primary btn-sm" id="loadBtn">후보 불러오기</button>
            </div>
        </form>

        <div class="admin-toolbar">
            <div>
                <label for="minCount">최소 빈도</label>
                <input type="number" id="minCount" value="5" style="width: 80px">
                <button class="btn btn-outline-primary btn-sm" id="bulkBtn">이 조건으로 일괄 등록</button>
            </div>
            <div id="loadStatus" class="text-muted small"></div>
        </div>

        <div class="admin-table-wrapper">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>단어</th>
                    <th>빈도</th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody id="candidateBody">
                <tr>
                    <td colspan="3" class="text-center text-muted">"후보 불러오기" 를 눌러 주세요.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:inline="javascript">
    const translationId = /*[[${translationId}]]*/ null;
    const bookOrder = /*[[${bookOrder}]]*/ null;
</script>
<script type="module">
    import {fetchAdmin, initAdminSidebarToggle, initAdminSidebarGroups} from "/js/admin/admin-common.js";

    initAdminSidebarToggle();
    initAdminSidebarGroups();

    let candidates = [];

    const render = () => {
        const body = document.getElementById("candidateBody");
        if (candidates.length === 0) {
            body.innerHTML = '<tr><td colspan="3" class="text-center text-muted">후보가 없습니다.</td></tr>';
            return;
        }
        body.replaceChildren(...candidates.map(c => {
            const tr = document.createElement("tr");

            const term = document.createElement("td");
            term.textContent = c.term;

            const count = document.createElement("td");
            count.textContent = String(c.count);

            const actions = document.createElement("td");
            actions.className = "admin-actions";

            const addBtn = document.createElement("button");
            addBtn.className = "btn btn-outline-primary btn-sm";
            addBtn.textContent = "어휘 등록";
            addBtn.addEventListener("click", () => registerOne(c.term, "CANDIDATE"));

            const blockBtn = document.createElement("button");
            blockBtn.className = "btn btn-outline-danger btn-sm";
            blockBtn.textContent = "차단";
            // 차단은 재추출을 막는 장치다. 이게 없으면 같은 쓰레기 단어가 재계산마다 되살아난다.
            blockBtn.addEventListener("click", () => registerOne(c.term, "BLOCKED"));

            actions.append(addBtn, blockBtn);
            tr.append(term, count, actions);
            return tr;
        }));
    };

    const registerOne = async (term, status) => {
        try {
            await fetchAdmin(`/api/v1/admin/bible/words?translationId=${translationId}`, {
                method: "POST",
                body: JSON.stringify({term, category: "ETC", status, aliases: []}),
            });
            candidates = candidates.filter(c => c.term !== term);
            render();
        } catch (e) {
            alert(e.message);
        }
    };

    document.getElementById("loadBtn").addEventListener("click", async () => {
        if (!translationId) {
            alert("번역본을 먼저 선택하고 '화면 이동' 을 눌러 주세요.");
            return;
        }
        const status = document.getElementById("loadStatus");
        status.textContent = "계산 중… (번역본 전체는 수 초 걸립니다)";
        try {
            const query = bookOrder ? `&bookOrder=${bookOrder}` : "";
            candidates = await fetchAdmin(
                `/api/v1/admin/bible/word-stats/candidates?translationId=${translationId}${query}&limit=1000`);
            status.textContent = `${candidates.length}건`;
            render();
        } catch (e) {
            status.textContent = "";
            alert(e.message);
        }
    });

    // 초기 구축은 6천 건 규모다. 한 건씩 누를 수 없으므로 일괄 등록이 필수다.
    document.getElementById("bulkBtn").addEventListener("click", async () => {
        const min = parseInt(document.getElementById("minCount").value, 10) || 1;
        const terms = candidates.filter(c => c.count >= min).map(c => c.term);
        if (terms.length === 0) {
            alert("조건에 맞는 후보가 없습니다. 먼저 후보를 불러오세요.");
            return;
        }
        if (!confirm(`${terms.length}건을 후보(CANDIDATE)로 등록합니다.`)) return;
        try {
            const r = await fetchAdmin(`/api/v1/admin/bible/words/bulk?translationId=${translationId}`,
                {method: "POST", body: JSON.stringify({terms})});
            // 거부 건수를 보여 줘야 한다. 조용히 빠지면 "왜 6천 건이 아니지" 를 알 방법이 없다.
            const rejected = r.rejected ? ` / 거부 ${r.rejected}건(조사·활용형)` : "";
            alert(`등록 ${r.imported}건 / 건너뜀 ${r.skipped}건${rejected}`);
            candidates = candidates.filter(c => c.count < min);
            render();
        } catch (e) {
            alert(e.message);
        }
    });
</script>
</body>
</html>
