<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>단어 어휘 관리 | ElSeeker</title>
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin/admin.css?v=5.2" rel="stylesheet">
    <link href="/css/admin/admin-filter-row.css?v=1.0" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
    <aside th:replace="~{admin/fragments/admin-sidebar :: sidebar}"></aside>
    <div class="admin-sidebar-overlay" data-admin-sidebar-close></div>
    <main class="admin-content">
        <div class="admin-topbar">
            <button class="admin-sidebar-toggle" type="button" aria-label="메뉴 열기" data-admin-sidebar-toggle>
                <span></span>
            </button>
            <span class="admin-topbar-title">관리자</span>
        </div>
        <div class="admin-breadcrumb">단어 어휘 관리</div>
        <h2>단어 어휘 관리</h2>
        <p class="text-muted small">
            어휘는 <strong>번역본별</strong>로 관리합니다. 같은 언어의 다른 번역본에서 복사한 뒤
            후보 리포트로 표기 차이만 메우는 것이 빠릅니다.
        </p>

        <form class="admin-form admin-form-grid admin-filter-row" method="get"
              action="/web/admin/bible/words">
            <div class="form-group">
                <label for="translationId">번역본</label>
                <select id="translationId" name="translationId" onchange="this.form.submit()">
                    <option value="">선택하세요</option>
                    <option th:each="t : ${translations}"
                            th:value="${t.id}"
                            th:text="${t.name}"
                            th:selected="${t.id == selectedTranslationId}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="status">상태</label>
                <select id="status" name="status">
                    <option value="">전체</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}"
                            th:selected="${s == status}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="category">분류</label>
                <select id="category" name="category">
                    <option value="">전체</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c.displayName}"
                            th:selected="${c == category}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="term">표제어</label>
                <input type="text" id="term" name="term" th:value="${term}" placeholder="포함 검색">
            </div>
            <div class="admin-form-actions">
                <button type="submit" class="btn btn-primary btn-sm">조회</button>
            </div>
        </form>

        <div class="admin-toolbar" th:if="${translationId != null}">
            <div class="admin-toolbar-group">
                <button class="btn btn-outline-secondary btn-sm" id="importDictBtn">사전에서 가져오기</button>
                <button class="btn btn-outline-secondary btn-sm" id="copyFromBtn">다른 번역본에서 복사</button>
            </div>
            <a th:href="@{/web/admin/bible/words/new(translationId=${translationId})}"
               class="btn btn-primary btn-sm">등록</a>
        </div>

        <div class="admin-table-wrapper" th:if="${page != null}">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>표제어</th>
                    <th>분류</th>
                    <th>상태</th>
                    <th>사전</th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="w : ${page.content}">
                    <td th:text="${w.id}"></td>
                    <td th:text="${w.term}"></td>
                    <td th:text="${w.category.displayName}"></td>
                    <td th:text="${w.status.displayName}"></td>
                    <td th:text="${w.dictionaryId != null} ? '연결됨' : '-'"></td>
                    <td class="admin-actions">
                        <a th:href="@{/web/admin/bible/words/{id}/edit(id=${w.id})}"
                           class="btn btn-outline-primary btn-sm">수정</a>
                        <!-- 이미 그 상태인 행에는 버튼을 두지 않는다. 눌러도 바뀌는 것이 없는데
                             화면은 새로고침되어 방금 무슨 일이 일어났는지 알 수 없다. -->
                        <button class="btn btn-outline-success btn-sm" th:data-id="${w.id}"
                                th:data-name="${w.term}" th:if="${w.status.name() != 'APPROVED'}"
                                onclick="approveWord(this)">승인</button>
                        <button class="btn btn-outline-warning btn-sm" th:data-id="${w.id}"
                                th:data-name="${w.term}" th:if="${w.status.name() != 'BLOCKED'}"
                                onclick="blockWord(this)">차단</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(page.content)}">
                    <td colspan="6" class="text-center text-muted">데이터가 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 768px 이하에서는 위 표가 숨겨지고 이 카드 목록이 대신 뜬다. 하나만 두면 빈 화면이 된다. -->
        <div class="admin-card-list" th:if="${page != null}">
            <div class="admin-card" th:each="w : ${page.content}">
                <div class="admin-card-title" th:text="${w.term}">표제어</div>
                <div class="admin-card-row">
                    <span class="admin-card-label">ID</span>
                    <span class="admin-card-value" th:text="${w.id}"></span>
                </div>
                <div class="admin-card-row">
                    <span class="admin-card-label">분류</span>
                    <span class="admin-card-value" th:text="${w.category.displayName}"></span>
                </div>
                <div class="admin-card-row">
                    <span class="admin-card-label">상태</span>
                    <span class="admin-card-value" th:text="${w.status.displayName}"></span>
                </div>
                <div class="admin-card-row">
                    <span class="admin-card-label">사전</span>
                    <span class="admin-card-value" th:text="${w.dictionaryId != null} ? '연결됨' : '-'"></span>
                </div>
                <div class="admin-card-actions">
                    <a th:href="@{/web/admin/bible/words/{id}/edit(id=${w.id})}"
                       class="btn btn-outline-primary btn-sm">수정</a>
                    <button class="btn btn-outline-success btn-sm" th:data-id="${w.id}"
                            th:data-name="${w.term}" th:if="${w.status.name() != 'APPROVED'}"
                            onclick="approveWord(this)">승인</button>
                    <button class="btn btn-outline-warning btn-sm" th:data-id="${w.id}"
                            th:data-name="${w.term}" th:if="${w.status.name() != 'BLOCKED'}"
                            onclick="blockWord(this)">차단</button>
                </div>
            </div>
            <div class="admin-card text-center text-muted"
                 th:if="${#lists.isEmpty(page.content)}">데이터가 없습니다.</div>
        </div>

        <!-- 이전에는 "1 / 7" 을 글자로만 찍어 2페이지로 갈 수단이 아예 없었다. -->
        <div class="admin-pagination" th:if="${page != null and page.totalPages > 1}">
            <a th:if="${page.number > 0}"
               th:href="@{/web/admin/bible/words(translationId=${translationId},status=${status},category=${category},term=${term},page=${page.number - 1},size=${page.size})}">이전</a>
            <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                      th:if="${i >= page.number - 2 and i <= page.number + 2}">
                <a th:if="${i != page.number}"
                   th:href="@{/web/admin/bible/words(translationId=${translationId},status=${status},category=${category},term=${term},page=${i},size=${page.size})}"
                   th:text="${i + 1}"></a>
                <span th:if="${i == page.number}" class="active" th:text="${i + 1}"></span>
            </th:block>
            <a th:if="${page.number + 1 < page.totalPages}"
               th:href="@{/web/admin/bible/words(translationId=${translationId},status=${status},category=${category},term=${term},page=${page.number + 1},size=${page.size})}">다음</a>
        </div>
    </main>
</div>
<script th:inline="javascript">
    const translationId = /*[[${translationId}]]*/ null;
</script>
<script type="module">
    import {fetchAdmin, initAdminSidebarToggle, initAdminSidebarGroups} from "/js/admin/admin-common.js";
    import {showConfirm} from "/js/confirm-dialog.js?v=1.0";

    initAdminSidebarToggle();
    initAdminSidebarGroups();

    // 승인하면 사용자 화면에 나가기 시작한다. 통계 행은 여기서 만들지 않는다 —
    // 다음 재계산이 채우므로, 지금 바로 숫자가 보이지 않는 것은 정상이다.
    window.approveWord = async (btn) => {
        const id = btn.dataset.id;
        const ok = await showConfirm(
            `"${btn.dataset.name}" 을(를) 승인하시겠습니까?\n통계는 다음 재계산에서 채워집니다.`,
            {title: "승인", confirmText: "승인"});
        if (!ok) return;
        try {
            await fetchAdmin(`/api/v1/admin/bible/words/${id}/status`,
                {method: "PATCH", body: JSON.stringify({status: "APPROVED"})});
            location.reload();
        } catch (e) {
            alert(e.message);
        }
    };

    // 차단은 통계 행까지 즉시 지운다. 재계산을 기다리면 그때까지 화면에 계속 보인다.
    window.blockWord = async (btn) => {
        const id = btn.dataset.id;
        const ok = await showConfirm(`"${btn.dataset.name}" 을(를) 차단하시겠습니까?\n연결된 통계 행이 즉시 삭제됩니다.`,
            {title: "차단", confirmText: "차단", danger: true});
        if (!ok) return;
        try {
            await fetchAdmin(`/api/v1/admin/bible/words/${id}/status`,
                {method: "PATCH", body: JSON.stringify({status: "BLOCKED"})});
            location.reload();
        } catch (e) {
            alert(e.message);
        }
    };

    document.getElementById("importDictBtn")?.addEventListener("click", async () => {
        try {
            const r = await fetchAdmin(
                `/api/v1/admin/bible/words/import-from-dictionary?translationId=${translationId}`, {method: "POST"});
            alert(`가져오기 완료: 등록 ${r.imported}건 / 건너뜀 ${r.skipped}건`);
            location.reload();
        } catch (e) {
            alert(e.message);
        }
    });

    document.getElementById("copyFromBtn")?.addEventListener("click", async () => {
        const source = prompt("복사해 올 번역본 ID 를 입력하세요 (같은 언어만 가능)");
        if (!source) return;
        try {
            const r = await fetchAdmin(`/api/v1/admin/bible/words/copy-from?translationId=${translationId}`,
                {method: "POST", body: JSON.stringify({sourceTranslationId: parseInt(source, 10)})});
            alert(`복사 완료: 등록 ${r.imported}건 / 건너뜀 ${r.skipped}건`);
            location.reload();
        } catch (e) {
            alert(e.message);
        }
    });
</script>
</body>
</html>
