<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>단어 어휘 관리 | ElSeeker</title>
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin/admin.css?v=5.1" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
    <aside th:replace="~{admin/fragments/admin-sidebar :: sidebar}"></aside>
    <div class="admin-sidebar-overlay" data-admin-sidebar-close></div>
    <main class="admin-content">
        <div class="admin-topbar">
            <button class="admin-sidebar-toggle" type="button" aria-label="메뉴 열기" data-admin-sidebar-toggle>
                <span></span>
            </button>
            <span class="admin-topbar-title">관리자</span>
        </div>
        <div class="admin-breadcrumb">단어 어휘 관리</div>
        <h2>단어 어휘 관리</h2>
        <p class="text-muted small">
            어휘는 <strong>번역본별</strong>로 관리합니다. 같은 언어의 다른 번역본에서 복사한 뒤
            후보 리포트로 표기 차이만 메우는 것이 빠릅니다.
        </p>

        <form class="admin-form" method="get" action="/web/admin/bible/words">
            <div class="form-group">
                <label for="translationId">번역본</label>
                <select id="translationId" name="translationId" onchange="this.form.submit()">
                    <option value="">선택하세요</option>
                    <option th:each="t : ${translations}"
                            th:value="${t.id}"
                            th:text="${t.name}"
                            th:selected="${t.id == selectedTranslationId}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="status">상태</label>
                <select id="status" name="status">
                    <option value="">전체</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}"
                            th:selected="${s == status}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="category">분류</label>
                <select id="category" name="category">
                    <option value="">전체</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c.displayName}"
                            th:selected="${c == category}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="term">표제어</label>
                <input type="text" id="term" name="term" th:value="${term}" placeholder="포함 검색">
            </div>
            <div class="admin-form-actions">
                <button type="submit" class="btn btn-primary btn-sm">조회</button>
            </div>
        </form>

        <div class="admin-toolbar" th:if="${translationId != null}">
            <div>
                <button class="btn btn-outline-secondary btn-sm" id="importDictBtn">사전에서 가져오기</button>
                <button class="btn btn-outline-secondary btn-sm" id="copyFromBtn">다른 번역본에서 복사</button>
            </div>
            <a th:href="@{/web/admin/bible/words/new(translationId=${translationId})}"
               class="btn btn-primary btn-sm">등록</a>
        </div>

        <div class="admin-table-wrapper" th:if="${page != null}">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>표제어</th>
                    <th>분류</th>
                    <th>상태</th>
                    <th>사전</th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="w : ${page.content}">
                    <td th:text="${w.id}"></td>
                    <td th:text="${w.term}"></td>
                    <td th:text="${w.category.displayName}"></td>
                    <td th:text="${w.status.displayName}"></td>
                    <td th:text="${w.dictionaryId != null} ? '연결됨' : '-'"></td>
                    <td class="admin-actions">
                        <a th:href="@{/web/admin/bible/words/{id}/edit(id=${w.id})}"
                           class="btn btn-outline-primary btn-sm">수정</a>
                        <button class="btn btn-outline-warning btn-sm" th:data-id="${w.id}"
                                th:data-name="${w.term}" onclick="blockWord(this)">차단</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(page.content)}">
                    <td colspan="6" class="text-center text-muted">데이터가 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="admin-pagination" th:if="${page != null and page.totalPages > 1}">
            <span th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>
        </div>
    </main>
</div>
<script th:inline="javascript">
    const translationId = /*[[${translationId}]]*/ null;
</script>
<script type="module">
    import {fetchAdmin, initAdminSidebarToggle, initAdminSidebarGroups} from "/js/admin/admin-common.js";
    import {showConfirm} from "/js/confirm-dialog.js?v=1.0";

    initAdminSidebarToggle();
    initAdminSidebarGroups();

    // 차단은 통계 행까지 즉시 지운다. 재계산을 기다리면 그때까지 화면에 계속 보인다.
    window.blockWord = async (btn) => {
        const id = btn.dataset.id;
        const ok = await showConfirm(`"${btn.dataset.name}" 을(를) 차단하시겠습니까?\n연결된 통계 행이 즉시 삭제됩니다.`,
            {title: "차단", confirmText: "차단", danger: true});
        if (!ok) return;
        try {
            await fetchAdmin(`/api/v1/admin/bible/words/${id}/status`,
                {method: "PATCH", body: JSON.stringify({status: "BLOCKED"})});
            location.reload();
        } catch (e) {
            alert(e.message);
        }
    };

    document.getElementById("importDictBtn")?.addEventListener("click", async () => {
        try {
            const r = await fetchAdmin(
                `/api/v1/admin/bible/words/import-from-dictionary?translationId=${translationId}`, {method: "POST"});
            alert(`가져오기 완료: 등록 ${r.imported}건 / 건너뜀 ${r.skipped}건`);
            location.reload();
        } catch (e) {
            alert(e.message);
        }
    });

    document.getElementById("copyFromBtn")?.addEventListener("click", async () => {
        const source = prompt("복사해 올 번역본 ID 를 입력하세요 (같은 언어만 가능)");
        if (!source) return;
        try {
            const r = await fetchAdmin(`/api/v1/admin/bible/words/copy-from?translationId=${translationId}`,
                {method: "POST", body: JSON.stringify({sourceTranslationId: parseInt(source, 10)})});
            alert(`복사 완료: 등록 ${r.imported}건 / 건너뜀 ${r.skipped}건`);
            location.reload();
        } catch (e) {
            alert(e.message);
        }
    });
</script>
</body>
</html>
