<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head
        th:replace="~{fragments/head :: head('나의 문의 | ElSeeker', true, '/css/search.css?v=5.9,/css/member/my-inquiries.css?v=1.1')}"
        th:with="robotsContent='noindex'">
</head>

<body class="has-fixed-nav my-inquiries-page">
<header th:replace="~{fragments/header :: header(hideTopNavAccount=true)}"></header>

<main class="container content-wrapper my-inquiries-shell">
    <div id="myInquiriesTabsSentinel" class="my-inquiries-tabs-sentinel" aria-hidden="true"></div>
    <nav id="myInquiriesTabs" class="my-inquiries-tabs" role="tablist" aria-label="문의 상태">
        <button id="myInquiriesTabAll" class="my-inquiries-tab active" role="tab" type="button"
                data-status="" aria-selected="true">
            전체
        </button>
        <button id="myInquiriesTabReceived" class="my-inquiries-tab" role="tab" type="button"
                data-status="RECEIVED" aria-selected="false">
            접수
        </button>
        <button id="myInquiriesTabAnswered" class="my-inquiries-tab" role="tab" type="button"
                data-status="ANSWERED" aria-selected="false">
            답변완료
        </button>
        <button id="myInquiriesTabClosed" class="my-inquiries-tab" role="tab" type="button"
                data-status="CLOSED" aria-selected="false">
            종료
        </button>
    </nav>

    <div class="my-inquiries-actions">
        <a href="/web/member/my-inquiries/new" class="btn btn-primary btn-sm my-inquiries-create-btn">
            문의하기
        </a>
    </div>

    <article class="card card-panel card-soft my-inquiries-info-card border-0 shadow-sm">
        <div class="card-body p-4">

            <div id="myInquiriesSkeleton" class="my-inquiries-skeleton-group">
                <div class="skeleton skeleton-inquiry-card"></div>
                <div class="skeleton skeleton-inquiry-card"></div>
                <div class="skeleton skeleton-inquiry-card"></div>
            </div>

            <div id="myInquiriesList" class="my-inquiries-list" role="tabpanel"></div>

            <div id="myInquiriesEmpty" class="my-inquiries-empty d-none">
                <div class="my-inquiries-empty-icon" aria-hidden="true">💬</div>
                <p class="my-inquiries-empty-title">아직 등록한 문의가 없습니다</p>
                <p class="my-inquiries-empty-desc">궁금한 점이나 불편한 사항을 문의해 보세요.</p>
                <a href="/web/member/my-inquiries/new" class="btn btn-primary">문의하기</a>
            </div>

            <div id="myInquiriesLoader" class="my-inquiries-loader" hidden>
                <div class="spinner-container">
                    <div class="custom-spinner" aria-hidden="true"></div>
                    <p class="loader-text">문의 목록을 불러오는 중입니다...</p>
                </div>
            </div>
            <div id="myInquiriesSentinel" class="my-inquiries-sentinel" aria-hidden="true"></div>
        </div>
    </article>
</main>

<button id="scrollToTopBtn" class="scroll-to-top-btn" type="button" aria-label="맨 위로 이동">↑</button>

<script type="module" src="/js/member/my-inquiries.js?v=1.1"></script>
</body>

</html>
