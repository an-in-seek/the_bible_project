<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head
        th:replace="~{fragments/head :: head('문의 상세 | ElSeeker', true, '/css/member/my-inquiries.css?v=1.2')}"
        th:with="robotsContent='noindex'">
</head>

<body class="has-fixed-nav my-inquiries-page">
<header th:replace="~{fragments/header :: header(hideTopNavAccount=true)}"></header>

<main class="container content-wrapper my-inquiry-detail-shell">

    <div id="myInquiryDetailSkeleton" class="my-inquiry-detail-skeleton">
        <div class="skeleton skeleton-detail-title"></div>
        <div class="skeleton skeleton-detail-meta"></div>
        <div class="skeleton skeleton-detail-body"></div>
    </div>

    <article id="myInquiryDetailCard" class="card card-panel card-soft my-inquiries-info-card border-0 shadow-sm d-none">
        <div class="card-body p-4">

            <!-- 질문 영역 -->
            <div class="my-inquiry-question">
                <div class="my-inquiry-question-header">
                    <div class="my-inquiry-meta-row">
                        <span id="myInquiryCategoryBadge" class="my-inquiry-category-badge"></span>
                        <span id="myInquiryStatusBadge" class="my-inquiry-status-badge"></span>
                    </div>
                    <h1 id="myInquiryTitle" class="my-inquiry-title"></h1>
                    <p id="myInquiryDate" class="my-inquiry-date"></p>
                </div>
                <div id="myInquiryContent" class="my-inquiry-content"></div>
            </div>

            <!-- 작성자 액션 버튼 (RECEIVED 상태 + 작성자 본인일 때만) -->
            <div id="myInquiryActions" class="my-inquiry-actions d-none">
                <a id="myInquiryEditLink" href="#" class="btn btn-outline-primary btn-sm">수정</a>
                <button id="myInquiryDeleteBtn" type="button" class="btn btn-outline-danger btn-sm">삭제</button>
            </div>

            <hr class="my-inquiry-divider">

            <!-- 답변 영역 -->
            <div class="my-inquiry-answer">
                <div class="my-inquiry-answer-label">관리자 답변</div>
                <div id="myInquiryAnswerContent" class="my-inquiry-answer-content">
                    <p class="my-inquiry-answer-pending">답변 대기 중입니다.</p>
                </div>
                <p id="myInquiryAnsweredAt" class="my-inquiry-answered-at d-none"></p>
            </div>

            <!-- 하단 내비게이션 -->
            <div class="my-inquiry-detail-footer">
                <a href="/web/member/my-inquiries" class="btn btn-outline-secondary btn-sm">목록으로</a>
            </div>

        </div>
    </article>

    <div id="myInquiryDetailError" class="my-inquiries-empty d-none">
        <div class="my-inquiries-empty-icon" aria-hidden="true">⚠️</div>
        <p class="my-inquiries-empty-title">문의를 불러오지 못했습니다</p>
        <p class="my-inquiries-empty-desc">잠시 후 다시 시도해 주세요.</p>
        <a href="/web/member/my-inquiries" class="btn btn-outline-primary btn-sm">목록으로 돌아가기</a>
    </div>

</main>

<script type="module" src="/js/member/my-inquiry-detail.js?v=1.2"></script>
</body>

</html>
