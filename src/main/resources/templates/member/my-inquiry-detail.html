<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head
        th:replace="~{fragments/head :: head('문의 상세 | ElSeeker', true, '/css/member/my-inquiries.css?v=1.0')}"
        th:with="robotsContent='noindex'">
</head>

<body class="has-fixed-nav my-inquiries-page">
<header th:replace="~{fragments/header :: header(hideTopNavAccount=true)}"></header>

<main class="container content-wrapper my-inquiry-detail-shell">

    <div id="myInquiryDetailSkeleton" class="my-inquiry-detail-skeleton">
        <div class="skeleton skeleton-detail-title"></div>
        <div class="skeleton skeleton-detail-meta"></div>
        <div class="skeleton skeleton-detail-body"></div>
    </div>

    <article id="myInquiryDetailCard" class="card card-panel card-soft my-inquiries-info-card border-0 shadow-sm d-none">
        <div class="card-body p-4">

            <!-- 질문 영역 -->
            <div class="my-inquiry-question">
                <div class="my-inquiry-question-header">
                    <div class="my-inquiry-meta-row">
                        <span id="myInquiryCategoryBadge" class="my-inquiry-category-badge"></span>
                        <span id="myInquiryStatusBadge" class="my-inquiry-status-badge"></span>
                    </div>
                    <h1 id="myInquiryTitle" class="my-inquiry-title"></h1>
                    <p id="myInquiryDate" class="my-inquiry-date"></p>
                </div>
                <div id="myInquiryContent" class="my-inquiry-content"></div>
            </div>

            <!-- 수정 폼 (RECEIVED 상태에서 수정 버튼 클릭 시 노출) -->
            <div id="myInquiryEditPanel" class="my-inquiries-form-panel d-none" aria-label="문의 수정">
                <div class="my-inquiries-form-header">
                    <span class="my-inquiries-form-title">문의 수정</span>
                    <button id="myInquiryEditCancelBtn" type="button" class="my-inquiries-form-close" aria-label="닫기">✕</button>
                </div>
                <form id="myInquiryEditForm" novalidate>
                    <div class="my-inquiries-form-field">
                        <label class="my-inquiries-form-label" for="myInquiryEditCategory">카테고리</label>
                        <select id="myInquiryEditCategory" class="form-select my-inquiries-form-select" required>
                            <option value="">카테고리 선택</option>
                            <option value="ACCOUNT">계정/로그인</option>
                            <option value="CONTENT">성경/콘텐츠</option>
                            <option value="GAME">게임</option>
                            <option value="BUG">오류/버그</option>
                            <option value="SUGGESTION">제안/건의</option>
                            <option value="ETC">기타</option>
                        </select>
                    </div>
                    <div class="my-inquiries-form-field">
                        <label class="my-inquiries-form-label" for="myInquiryEditTitle">제목</label>
                        <input type="text" id="myInquiryEditTitle" class="form-control my-inquiries-form-input"
                               placeholder="제목을 입력하세요 (최대 200자)" maxlength="200" required>
                    </div>
                    <div class="my-inquiries-form-field">
                        <label class="my-inquiries-form-label" for="myInquiryEditContent">내용</label>
                        <textarea id="myInquiryEditContent" class="form-control my-inquiries-form-textarea"
                                  placeholder="문의 내용을 입력하세요 (최대 4000자)" maxlength="4000" rows="6" required></textarea>
                    </div>
                    <div id="myInquiryEditError" class="my-inquiries-form-error d-none"></div>
                    <div class="my-inquiries-form-actions">
                        <button type="button" id="myInquiryEditCancelBtn2" class="btn btn-outline-secondary btn-sm">취소</button>
                        <button type="submit" class="btn btn-primary btn-sm">저장</button>
                    </div>
                </form>
            </div>

            <!-- 작성자 액션 버튼 (RECEIVED 상태에서만) -->
            <div id="myInquiryActions" class="my-inquiry-actions d-none">
                <button id="myInquiryEditBtn" type="button" class="btn btn-outline-primary btn-sm">수정</button>
                <button id="myInquiryDeleteBtn" type="button" class="btn btn-outline-danger btn-sm">삭제</button>
            </div>

            <hr class="my-inquiry-divider">

            <!-- 답변 영역 -->
            <div class="my-inquiry-answer">
                <div class="my-inquiry-answer-label">관리자 답변</div>
                <div id="myInquiryAnswerContent" class="my-inquiry-answer-content">
                    <p class="my-inquiry-answer-pending">답변 대기 중입니다.</p>
                </div>
                <p id="myInquiryAnsweredAt" class="my-inquiry-answered-at d-none"></p>
            </div>

        </div>
    </article>

    <div id="myInquiryDetailError" class="my-inquiries-empty d-none">
        <div class="my-inquiries-empty-icon" aria-hidden="true">⚠️</div>
        <p class="my-inquiries-empty-title">문의를 불러오지 못했습니다</p>
        <p class="my-inquiries-empty-desc">잠시 후 다시 시도해 주세요.</p>
        <a href="/web/member/my-inquiries" class="btn btn-outline-primary btn-sm">목록으로 돌아가기</a>
    </div>

</main>

<button id="scrollToTopBtn" class="scroll-to-top-btn" type="button" aria-label="맨 위로 이동">↑</button>

<script type="module" src="/js/member/my-inquiry-detail.js?v=1.0"></script>
</body>

</html>
