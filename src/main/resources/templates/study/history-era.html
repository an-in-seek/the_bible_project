<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('성경 시대별 사건 목록 | ElSeeker', true, null)}"
      th:with="pageDescription='성경 속 시대별 주요 사건들을 연대순으로 정리한 학습 페이지입니다.',
               pageKeywords='성경 시대,성경 사건,성경 역사 연대,구약 시대,신약 시대'"></head>
<body class="has-fixed-nav">

<header th:replace="~{fragments/header :: header}"></header>

<main class="container content-wrapper">
  <section class="mb-3">
    <h1 class="h4 fw-semibold mb-1"
        th:text="${currentEra != null ? currentEra.label : '알 수 없는 시대'}"></h1>
    <p class="text-muted small mb-1" th:if="${currentEra != null}"
       th:text="${currentEra.period}"></p>
    <p class="text-muted small mb-2" th:if="${currentEra != null and !#lists.isEmpty(currentEra.figures)}"
       th:text="|대표 인물: ${#strings.listJoin(currentEra.figures, ' · ')}|"></p>
    <p class="text-muted mb-0">선택한 시대의 주요 사건을 확인하세요.</p>
  </section>

  <section>
    <div th:if="${#lists.isEmpty(events)}" class="alert alert-secondary mb-0">
      이 시대의 사건 정리를 준비하고 있어요.
    </div>
    <div class="row g-3" th:if="${!#lists.isEmpty(events)}">
      <div class="col-12 col-lg-6" th:each="event : ${events}">
        <a class="text-decoration-none"
           th:href="@{/web/study/history/event/{id}(id=${event.id})}">
          <div class="card h-100 border-0 shadow-sm">
            <div class="card-body">
              <h2 class="h6 fw-semibold mb-2" th:text="${event.title}"></h2>
              <p class="text-muted small mb-2" th:text="${event.description}"></p>
              <div class="d-flex flex-wrap gap-1">
                <span class="badge text-bg-light border text-muted"
                      th:text="${event.timeline}"></span>
                <span class="badge text-bg-light border text-muted"
                      th:text="${event.scriptureRange}"></span>
              </div>
            </div>
          </div>
        </a>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/js/study/history-era.js?v=2.3"></script>
</body>
</html>
