<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('성경 시대별 사건 목록 | ElSeeker', true, '/css/study/history-era.css?v=1.0')}"
      th:with="pageDescription='성경 속 시대별 주요 사건들을 연대순으로 정리한 학습 페이지입니다.',
               pageKeywords='성경 시대,성경 사건,성경 역사 연대,구약 시대,신약 시대'"></head>
<body class="has-fixed-nav">

<header th:replace="~{fragments/header :: header}"></header>

<main class="container content-wrapper history-era-main">
  <section class="era-detail-hero mb-4">
    <p class="era-detail-eyebrow mb-0">성경 연대기</p>
    <h1 class="era-detail-title"
        th:text="${currentEra != null ? currentEra.label : '알 수 없는 시대'}"></h1>
    <span class="era-detail-period"
          th:if="${currentEra != null and !#strings.isEmpty(currentEra.period)}"
          th:text="${currentEra.period}"></span>
    <div class="era-detail-figures"
         th:if="${currentEra != null and !#lists.isEmpty(currentEra.figures)}">
      <span class="era-detail-figures-label">대표 인물</span>
      <span class="era-detail-figure-chip"
            th:each="figure : ${currentEra.figures}"
            th:text="${figure}"></span>
    </div>
    <p class="era-detail-intro">선택한 시대의 주요 사건을 연대순으로 확인하세요.</p>
  </section>

  <section aria-label="시대별 주요 사건 목록">
    <div class="era-detail-list-head" th:if="${!#lists.isEmpty(events)}">
      <h2 class="era-detail-list-title">주요 사건</h2>
      <span class="era-detail-count" th:text="${#lists.size(events)}">0</span>
    </div>

    <div th:if="${#lists.isEmpty(events)}" class="era-detail-empty">
      <span class="era-detail-empty-icon" aria-hidden="true">📜</span>
      <p class="mb-0">이 시대의 사건 정리를 준비하고 있어요.</p>
    </div>

    <ol class="era-detail-events" th:if="${!#lists.isEmpty(events)}">
      <li class="era-detail-event" th:each="event, stat : ${events}">
        <span class="era-detail-marker" aria-hidden="true">
          <span th:text="${stat.count}">1</span>
        </span>
        <a class="era-detail-card"
           th:href="@{/web/study/history/event/{id}(id=${event.id})}">
          <div class="era-detail-card-head">
            <h3 class="era-detail-event-title" th:text="${event.title}"></h3>
            <span class="era-detail-chevron" aria-hidden="true">›</span>
          </div>
          <p class="era-detail-event-desc" th:text="${event.description}"></p>
          <div class="era-detail-tags">
            <span class="era-detail-tag"
                  th:if="${!#strings.isEmpty(event.timeline)}">
              <span aria-hidden="true">🕰️</span>
              <span th:text="${event.timeline}"></span>
            </span>
            <span class="era-detail-tag era-detail-tag--scripture"
                  th:if="${!#strings.isEmpty(event.scriptureRange)}">
              <span aria-hidden="true">📖</span>
              <span th:text="${event.scriptureRange}"></span>
            </span>
          </div>
        </a>
      </li>
    </ol>
  </section>
</main>

<script type="module" src="/js/study/history-era.js?v=2.3"></script>
</body>
</html>
