<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head(
        '구약 왕들 연대표 - 통일왕국, 북이스라엘, 남유다 왕정 정리 | ElSeeker',
        true,
        '/css/study/old-testament-kings.css?v=1.3')}"
      th:with="pageDescription='사울, 다윗, 솔로몬의 통일왕국부터 북이스라엘과 남유다의 왕들을 연대표로 정리한 성경 학습 페이지입니다.',
               pageKeywords='구약 왕들,성경 왕 연대표,이스라엘 왕,유다 왕,통일왕국,북이스라엘,남유다,성경 연대기'">
</head>
<body class="has-fixed-nav study-page" data-show-back="true">
<header th:replace="~{fragments/header :: header(pageTitle='구약 왕들 연대표', pageTitleVisible=true)}"></header>

<main class="container content-wrapper old-testament-kings-main">

  <!-- Intro -->
  <section class="otk-intro" aria-labelledby="otkIntroTitle">
    <p class="otk-kicker">Old Testament Kings Timeline</p>
    <h2 id="otkIntroTitle">구약 성경의 왕들 연대표</h2>
    <p class="otk-intro-lead">
      사울, 다윗, 솔로몬의 통일왕국부터 북이스라엘과 남유다의 왕들을
      왕국별 흐름과 동시대 관계로 살펴봅니다.
    </p>
    <p class="otk-note">
      연도는 대략적인 BCE 기준이며, 세부 연대는 자료와 해석에 따라 달라질 수 있습니다.
      남북 왕국의 재위는 섭정(co-regency)으로 겹치기도 합니다.
    </p>
  </section>

  <!-- Filter Bar -->
  <section class="otk-filter" aria-label="왕 연대표 필터">
    <div class="otk-filter-row">
      <div class="otk-filter-group">
        <span class="otk-filter-title" id="otkKingdomLabel">왕국</span>
        <div class="otk-segmented" id="otkKingdomFilter" role="group" aria-labelledby="otkKingdomLabel">
          <button type="button" data-kingdom="all" class="is-active" aria-pressed="true">전체</button>
          <button type="button" data-kingdom="united" aria-pressed="false">통일왕국</button>
          <button type="button" data-kingdom="israel" aria-pressed="false">북이스라엘</button>
          <button type="button" data-kingdom="judah" aria-pressed="false">남유다</button>
        </div>
      </div>

      <div class="otk-filter-group otk-filter-search">
        <label class="otk-filter-title" for="otkSearch">검색</label>
        <div class="otk-search-box">
          <input type="search" id="otkSearch" class="otk-search-input"
                 placeholder="왕 이름, 핵심 사건 검색" autocomplete="off"
                 aria-label="왕 이름 또는 핵심 사건 검색">
          <button type="button" id="otkSearchClear" class="otk-search-clear d-none"
                  aria-label="검색어 지우기">×
          </button>
        </div>
      </div>
    </div>

    <div class="otk-filter-group otk-filter-eval">
      <span class="otk-filter-title" id="otkEvalLabel">평가</span>
      <div class="otk-checkgroup" id="otkEvalFilter" role="group" aria-labelledby="otkEvalLabel">
        <label class="otk-check otk-check-good">
          <input type="checkbox" data-evaluation="faithful"><span>선한 왕</span>
        </label>
        <label class="otk-check otk-check-bad">
          <input type="checkbox" data-evaluation="evil"><span>악한 왕</span>
        </label>
        <label class="otk-check otk-check-mixed">
          <input type="checkbox" data-evaluation="mixed"><span>혼합 평가</span>
        </label>
        <label class="otk-check otk-check-usurp">
          <input type="checkbox" data-evaluation="usurper"><span>왕위 찬탈</span>
        </label>
        <label class="otk-check otk-check-disputed">
          <input type="checkbox" data-evaluation="disputed"><span>해석 주의</span>
        </label>
      </div>
    </div>
  </section>

  <!-- 모바일 왕국 탭 -->
  <div class="otk-mobile-tabs" id="otkMobileTabs" role="group" aria-label="왕국 선택 (모바일)">
    <button type="button" data-kingdom="all" class="is-active" aria-pressed="true">전체</button>
    <button type="button" data-kingdom="united" aria-pressed="false">통일</button>
    <button type="button" data-kingdom="israel" aria-pressed="false">북이스라엘</button>
    <button type="button" data-kingdom="judah" aria-pressed="false">남유다</button>
  </div>

  <!-- Timeline (위 → 아래 연대기) -->
  <section class="otk-timeline" aria-label="구약 왕들 연대표">
    <div class="otk-vtimeline" id="otkVTimeline">
      <!-- 통일왕국: 중앙 정렬 -->
      <ol class="otk-vtrack otk-vtrack-united" id="otkUnitedTrack" aria-label="통일왕국"></ol>

      <!-- 왕국 분열 마커 -->
      <div class="otk-era otk-era-split" id="otkEraSplit" data-era="split">
        <span class="otk-era-title">왕국 분열</span>
        <span class="otk-era-year">BCE 931</span>
      </div>

      <!-- 분열왕국: 북이스라엘(좌) · 남유다(우), 즉위 연도순 병합 -->
      <ol class="otk-vtrack otk-vtrack-divided" id="otkDividedTrack"
          aria-label="분열왕국 (북이스라엘 좌측 · 남유다 우측)"></ol>
    </div>

    <p id="otkEmpty" class="otk-empty d-none" role="status">조건에 맞는 왕이 없습니다. 필터를 줄여보세요.</p>
  </section>

  <!-- Related Study Links -->
  <section class="otk-related" aria-label="관련 학습">
    <h3 class="otk-related-title">이어서 살펴보기</h3>
    <div class="otk-related-links">
      <a href="/web/study/history">📜 성경 역사</a>
      <a href="/web/bible/translation">📖 성경 읽기</a>
      <a href="/web/study/dictionary">📕 성경 사전</a>
    </div>
  </section>

  <dialog id="otkDetailDialog" class="otk-detail-dialog" aria-labelledby="otkDetailTitle">
    <div id="otkDetail" class="otk-detail" aria-live="polite"></div>
  </dialog>
</main>

<script type="module" src="/js/study/old-testament-kings.js?v=1.2"></script>
<div th:replace="~{fragments/section-nav :: section-nav}"></div>
</body>
</html>
