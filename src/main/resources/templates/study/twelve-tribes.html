<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head
    th:replace="~{fragments/head :: head('이스라엘 12지파 - 이름, 상징, 영토 정리 | ElSeeker', true, '/css/search.css?v=5.0,/css/card.css?v=5.4,/css/study/twelve-tribes.css?v=5.2')}"
    th:with="pageDescription='이스라엘 12지파의 이름, 상징, 영토와 관련 성경 구절을 정리한 학습 페이지입니다.',
               pageKeywords='이스라엘 12지파,12지파 이름,12지파 영토,야곱의 아들,성경 지파'"></head>
<body class="has-fixed-nav has-dual-bottom-nav">

<header th:replace="~{fragments/header :: header}"></header>

<main class="container content-wrapper tribes-main">
  <!-- 인트로 -->
  <section class="tribes-intro">
    <p class="tribes-intro-text">
      야곱(이스라엘)의 <strong>열두 아들</strong>에게서 비롯된 이스라엘의 열두 지파입니다.
      네 어머니에게서 태어난 아들들이 각 지파의 조상이 되었으며,
      창세기 49장에서 야곱은 각 아들에게 축복과 예언을 남겼습니다.
    </p>
    <ul class="tribes-legend" aria-label="어머니별 지파 분류">
      <li class="tribes-legend-item" data-mother="leah">
        <span class="tribes-legend-dot" aria-hidden="true"></span>레아 <span class="tribes-legend-meta">6지파</span>
      </li>
      <li class="tribes-legend-item" data-mother="rachel">
        <span class="tribes-legend-dot" aria-hidden="true"></span>라헬 <span class="tribes-legend-meta">2지파</span>
      </li>
      <li class="tribes-legend-item" data-mother="bilhah">
        <span class="tribes-legend-dot" aria-hidden="true"></span>빌하 <span class="tribes-legend-meta">2지파</span> <span class="tribes-legend-note">· 라헬의 여종</span>
      </li>
      <li class="tribes-legend-item" data-mother="zilpah">
        <span class="tribes-legend-dot" aria-hidden="true"></span>실바 <span class="tribes-legend-meta">2지파</span> <span class="tribes-legend-note">· 레아의 여종</span>
      </li>
    </ul>
  </section>

  <!-- 로딩 상태 -->
  <div id="tribesLoading" class="tribes-loading text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">로딩 중...</span>
    </div>
    <p class="mt-3 text-muted">12지파 정보를 불러오는 중입니다...</p>
  </div>

  <!-- 콘텐츠 -->
  <div id="tribesContent" class="d-none">
    <div id="tribesGrid" class="tribes-grid"></div>
  </div>
</main>

<button id="scrollToTopBtn" class="scroll-to-top-btn" type="button" aria-label="맨 위로 이동">↑</button>

<script type="module" src="/js/study/twelve-tribes.js?v=1.2"></script>
</body>
</html>
