<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('성경 연대기 - 시대별 역사와 사건 정리 | ElSeeker', true, '/css/search.css?v=5.0,/css/study/history.css?v=5.4')}"
      th:with="pageDescription='창조부터 초대 교회까지 성경 연대기 흐름 속에서 시대별 대표 인물과 사건, 관련 성경책을 한눈에 살펴볼 수 있는 학습 페이지입니다.',
               pageKeywords='성경 역사,성경 연대기,성경 시대,구약 역사,신약 역사,성경 사건,성경 인물'"></head>
<body class="has-fixed-nav has-dual-bottom-nav">

<header th:replace="~{fragments/header :: header}"></header>

<main class="container content-wrapper">
  <section class="mb-4">
    <h1 class="h4 fw-semibold mb-2">성경 연대기</h1>
    <p class="history-intro mb-0">창조부터 초대 교회까지, 시대별 대표 인물과 사건, 관련 성경책을 연대기 흐름 속에서 한눈에 살펴보세요.</p>
  </section>

  <section class="history-map">
    <ol class="history-pc">
      <li class="history-item" th:each="block, iter : ${timelineBlocks}">
        <div class="testament-divider" th:if="${block.dividerLabel != null}">
          <span th:text="${block.dividerLabel}"></span>
        </div>

        <div class="history-row"
             th:classappend="${selectedEra == block.era.slug} ? ' is-selected' : ''">
          <div class="era-axis">
            <div class="era-marker">
              <span th:text="${#numbers.formatInteger(iter.index + 1, 2)}"></span>
            </div>
            <div class="era-period" th:text="${block.era.period}"></div>
            <a class="text-decoration-none era-label"
               th:href="@{/web/study/history/{era}(era=${block.era.slug})}"
               th:text="${block.era.label}"></a>
            <div class="era-figures" th:if="${!#lists.isEmpty(block.era.figures)}">
              <span class="figures-label">인물</span>
              <span th:text="${#strings.listJoin(block.era.figures, ' · ')}"></span>
            </div>
            <div class="d-flex flex-wrap gap-1 mt-1" th:if="${!#lists.isEmpty(block.eventHighlights)}">
              <a th:each="event : ${block.eventHighlights}"
                 class="event-chip"
                 th:href="@{/web/study/history/event/{id}(id=${event.id})}">
                <span th:text="${event.title}"></span>
                <span class="event-chip-timeline"
                      th:if="${event.timeline != '연대 미상'}"
                      th:text="${event.timeline}"></span>
              </a>
            </div>
          </div>

          <div class="era-content">
            <div class="card shadow-sm era-block"
                 th:each="group : ${block.bookGroups}">
              <div class="card-body">
                <div class="category-title" th:text="${group.groupName}"></div>
                <th:block th:each="book : ${group.books}">
                  <a th:if="${book.url != null}"
                     class="book-chip"
                     th:href="${book.url}"
                     th:text="${book.label}"></a>
                  <span th:if="${book.url == null}"
                        class="book-chip book-chip--static"
                        th:text="${book.label}"></span>
                </th:block>
              </div>
            </div>
          </div>
        </div>
      </li>
    </ol>
  </section>
</main>

<button id="scrollToTopBtn" class="scroll-to-top-btn" type="button" aria-label="맨 위로 이동">↑</button>

<script type="module" src="/js/study/history.js?v=2.4"></script>
</body>
</html>
