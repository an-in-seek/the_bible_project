<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head
        th:replace="~{fragments/head :: head('문의하기 | ElSeeker', true, '/css/support/contact.css?v=1.0')}"
        th:with="robotsContent='noindex',
                 pageDescription='ElSeeker에 로그인 없이 문의를 남길 수 있는 문의하기 페이지입니다. 계정/로그인 문제, 오류 신고, 제안 등을 보내주세요.'">
</head>

<body class="has-fixed-nav support-contact-page">
<header th:replace="~{fragments/header :: header}"></header>

<main class="container content-wrapper support-contact-shell">

    <section class="support-contact-intro">
        <h1 class="support-contact-title">문의하기</h1>
        <p class="support-contact-desc">
            로그인 없이도 문의를 남길 수 있습니다. 답변은 입력하신 <strong>이메일</strong>로 회신드립니다.<br>
            이미 로그인하셨다면 <a href="/web/member/my-inquiries">내 문의</a>에서 답변을 모아 확인할 수 있습니다.
        </p>
    </section>

    <article class="card card-panel card-soft support-contact-card border-0 shadow-sm">
        <div class="card-body p-4">
            <form id="contactForm" novalidate>

                <div class="support-contact-field">
                    <label class="support-contact-label" for="contactCategory">카테고리</label>
                    <select id="contactCategory" class="form-select support-contact-select" required aria-required="true">
                        <option value="">카테고리 선택</option>
                        <option value="ACCOUNT">계정/로그인</option>
                        <option value="CONTENT">성경/콘텐츠</option>
                        <option value="GAME">게임</option>
                        <option value="BUG">오류/버그</option>
                        <option value="SUGGESTION">제안/건의</option>
                        <option value="ETC">기타</option>
                    </select>
                </div>

                <div class="support-contact-field">
                    <label class="support-contact-label" for="contactEmail">회신받을 이메일</label>
                    <input type="email" id="contactEmail" class="form-control support-contact-input"
                           placeholder="example@email.com" maxlength="255" required aria-required="true"
                           autocomplete="email">
                </div>

                <div class="support-contact-field">
                    <label class="support-contact-label" for="contactName">이름 <span class="support-contact-optional">(선택)</span></label>
                    <input type="text" id="contactName" class="form-control support-contact-input"
                           placeholder="호칭을 입력하세요" maxlength="100" autocomplete="name">
                </div>

                <div class="support-contact-field">
                    <label class="support-contact-label" for="contactTitle">제목</label>
                    <input type="text" id="contactTitle" class="form-control support-contact-input"
                           placeholder="제목을 입력하세요" maxlength="200" required aria-required="true">
                    <div class="support-contact-counter" aria-live="polite" aria-atomic="true">
                        <span id="contactTitleCount">0</span>/200
                    </div>
                </div>

                <div class="support-contact-field">
                    <label class="support-contact-label" for="contactContent">내용</label>
                    <textarea id="contactContent" class="form-control support-contact-textarea"
                              placeholder="문의 내용을 입력하세요" maxlength="4000" rows="8"
                              required aria-required="true"></textarea>
                    <div class="support-contact-counter" aria-live="polite" aria-atomic="true">
                        <span id="contactContentCount">0</span>/4000
                    </div>
                </div>

                <!-- 스팸 방지용 허니팟: 사람에게 보이지 않으며 비워둬야 함. 봇이 채우면 서버가 조용히 폐기 -->
                <div class="support-contact-hp" aria-hidden="true">
                    <label for="contactWebsite">Website</label>
                    <input type="text" id="contactWebsite" name="website" tabindex="-1" autocomplete="off">
                </div>

                <div id="contactFormError" class="support-contact-error d-none" role="alert"></div>

                <div class="support-contact-actions">
                    <a href="/" class="btn btn-outline-secondary btn-sm">취소</a>
                    <button type="submit" id="contactSubmitBtn" class="btn btn-primary btn-sm">문의 보내기</button>
                </div>

            </form>
        </div>
    </article>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script type="module" src="/js/support/contact.js?v=1.0"></script>
</body>

</html>
