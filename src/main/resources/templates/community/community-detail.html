<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head
        th:replace="~{fragments/head :: head('성경 커뮤니티 게시글 | ElSeeker', true, '/css/card.css?v=5.4,/css/community/community-detail.css?v=7.1')}"
        th:with="pageDescription='커뮤니티 게시글 상세 보기 — 성경에 대한 질문과 나눔을 함께합니다.',
                 pageKeywords='성경 커뮤니티,성경 질문,성경 나눔,성경 토론'">
</head>

<body class="has-fixed-nav" th:attr="data-post-id=${postId}, data-back-link='/web/community'">
<header th:replace="~{fragments/header :: header(showNotificationButton=true, hideTopNavAccount=true, showPostMenu=true)}"></header>

<main class="container content-wrapper">
    <div class="community-layout">
        <!-- Main Content -->
        <div class="community-main">
            <article class="detail-card" aria-live="polite">
                <div class="detail-badges">
                    <div class="detail-badges-group">
                        <span id="postTypeBadge" class="detail-badge">카테고리</span>
                        <span id="postPopularBadge" class="detail-badge detail-badge-popular" hidden>인기</span>
                    </div>

                    <!-- 더보기 메뉴: 공유(공통) + owner는 수정/삭제, 비-owner는 신고 -->
                    <div id="postMenu" class="post-menu">
                        <button id="postMenuToggle" type="button" class="post-menu-toggle"
                                aria-haspopup="true" aria-expanded="false" aria-label="더보기">
                            <svg class="post-menu-toggle-icon" width="20" height="20" viewBox="0 0 24 24"
                                 fill="currentColor" aria-hidden="true" focusable="false">
                                <circle cx="12" cy="5" r="2"></circle>
                                <circle cx="12" cy="12" r="2"></circle>
                                <circle cx="12" cy="19" r="2"></circle>
                            </svg>
                        </button>
                        <div id="postMenuDropdown" class="post-menu-dropdown" role="menu" hidden>
                            <button id="btnSharePost" type="button" class="post-menu-item js-share" role="menuitem">
                                <span class="post-menu-item-icon">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                         aria-hidden="true" focusable="false">
                                        <circle cx="18" cy="5" r="3"></circle>
                                        <circle cx="6" cy="12" r="3"></circle>
                                        <circle cx="18" cy="19" r="3"></circle>
                                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                                    </svg>
                                </span><span class="post-menu-item-label">공유하기</span>
                            </button>
                            <button id="btnEditPost" type="button" class="post-menu-item" role="menuitem" data-owner-only hidden>
                                <span class="post-menu-item-icon">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                         aria-hidden="true" focusable="false">
                                        <path d="M12 20h9"></path>
                                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"></path>
                                    </svg>
                                </span><span class="post-menu-item-label">수정</span>
                            </button>
                            <button id="btnDeletePost" type="button" class="post-menu-item post-menu-item-danger" role="menuitem" data-owner-only hidden>
                                <span class="post-menu-item-icon">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                         aria-hidden="true" focusable="false">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                        <line x1="10" y1="11" x2="10" y2="17"></line>
                                        <line x1="14" y1="11" x2="14" y2="17"></line>
                                    </svg>
                                </span><span class="post-menu-item-label">삭제</span>
                            </button>
                            <button id="btnReportPost" type="button" class="post-menu-item post-menu-item-danger" role="menuitem" data-non-owner-only hidden>
                                <span class="post-menu-item-icon">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                         aria-hidden="true" focusable="false">
                                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                                        <line x1="4" y1="22" x2="4" y2="15"></line>
                                    </svg>
                                </span><span class="post-menu-item-label">신고</span>
                            </button>
                        </div>
                    </div>
                </div>

                <h1 id="postTitle" class="detail-title">게시글 제목</h1>

                <div class="detail-meta">
                    <div class="detail-author">
                        <span id="postAuthor" class="detail-author-name">작성자</span>
                        <span id="postTime" class="detail-time">시간</span>
                    </div>
                    <div class="detail-actions">
                        <span class="detail-pill">👀 <span id="postViewCount">0</span></span>
                        <span class="detail-pill">❤️ <span id="postReactionCount">0</span></span>
                        <span class="detail-pill">💬 <span id="postCommentCount">0</span></span>
                    </div>
                </div>

                <div id="postContent" class="detail-content">내용을 불러오는 중...</div>

                <!-- Action Buttons (Like) — 공유/신고는 상단 더보기 메뉴로 이동 -->
                <div class="post-footer-actions">
                    <button id="btnLike" class="btn-action btn-like">
                        <span class="icon">❤️</span>
                        <span class="btn-action-label">좋아요</span>
                        <span id="likeCountLabel">0</span>
                    </button>
                </div>
            </article>

            <section class="detail-comments" aria-live="polite">
                <div class="comment-header">
                    <h2 class="comment-title">댓글 <span id="commentCountLabel"
                                                       class="comment-count-highlight">0</span></h2>
                </div>

                <!-- Comment Input Form -->
                <div class="comment-form-wrapper">
                    <form id="commentForm" class="comment-form">
                            <textarea id="commentInput" class="comment-input" placeholder="따뜻한 댓글을 남겨주세요..." rows="3"
                                      required></textarea>
                        <div class="comment-form-footer">
                            <button type="submit" class="btn-submit-comment">등록</button>
                        </div>
                    </form>
                </div>

                <div id="commentList" class="comment-list"></div>
                <div id="commentEmpty" class="comment-empty" hidden>첫 번째 댓글의 주인공이 되어보세요!</div>
                <button id="commentMoreBtn" class="comment-more" type="button" hidden>댓글 더 보기</button>
            </section>
        </div>

        <!-- Sidebar: Widgets -->
        <aside class="community-sidebar community-animate" style="--delay: 0.2s;">
            <!-- Pinned Notice -->
            <div th:replace="~{fragments/community-widgets :: notice}"></div>

            <!-- TOP3 Popular -->
            <div id="feedTop3">
                <div th:replace="~{fragments/community-widgets :: top3('top3-card-desktop')}"></div>
            </div>
        </aside>
    </div>

    <!-- Report Modal -->
    <dialog id="reportModal" class="report-modal">
        <form method="dialog" class="report-form">
            <h3 class="report-title">신고 사유 선택</h3>
            <p class="report-desc">신고 사유를 선택해주세요. 허위 신고 시 제재를 받을 수 있습니다.</p>

            <div class="report-reasons">
                <label class="report-option">
                    <input type="radio" name="reason" value="SPAM" required checked>
                    <span class="report-label-text">스팸 / 홍보 도배</span>
                </label>
                <label class="report-option">
                    <input type="radio" name="reason" value="ABUSE">
                    <span class="report-label-text">욕설 / 비하 발언</span>
                </label>
                <label class="report-option">
                    <input type="radio" name="reason" value="HATE">
                    <span class="report-label-text">혐오 조장 및 차별</span>
                </label>
                <label class="report-option">
                    <input type="radio" name="reason" value="ADULT">
                    <span class="report-label-text">음란물 / 유해한 콘텐츠</span>
                </label>
                <label class="report-option">
                    <input type="radio" name="reason" value="ETC">
                    <span class="report-label-text">기타 부적절한 내용</span>
                </label>
            </div>

            <div class="report-actions">
                <button type="button" class="btn-cancel" id="btnCancelReport">취소</button>
                <button type="submit" class="btn-submit-report" value="confirm">신고하기</button>
            </div>
        </form>
    </dialog>

</main>

<div th:replace="~{fragments/confirm-dialog :: confirmDialog}"></div>

    <script type="module" src="/js/community/community-detail.js?v=4.3"></script>
</body>

</html>
