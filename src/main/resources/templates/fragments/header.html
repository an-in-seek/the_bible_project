<header th:fragment="header" class="site-header">
    <nav class="top-nav" aria-label="Primary Navigation">
        <div class="top-nav-row">
            <div class="top-nav-row-inner container">
                <div class="top-nav-left">
                    <button id="topNavBackButton"
                            type="button"
                            class="top-nav-back-button top-nav-btn btn btn-outline-secondary d-none"
                            aria-label="뒤로가기"
                            title="뒤로가기">
                        ⬅
                    </button>
                    <a href="/"
                       class="top-nav-home-button top-nav-btn btn btn-outline-secondary"
                       role="button"
                       aria-label="홈으로 이동"
                       title="홈으로 이동"
                       th:if="${hideHomeButton != true}">
                        🏠
                    </a>
                    <a id="topNavTranslationLink"
                       href="/web/bible/translation"
                       class="top-nav-translation-button top-nav-btn btn btn-outline-secondary dropdown-toggle d-none"
                       role="button"
                       aria-label="번역본 선택"
                       title="번역본 선택 페이지로 이동">
                        <span id="translationTypeLabel"></span>
                    </a>
                </div>

                <div class="top-nav-right">
                    <a id="topNavSearchLink"
                       href="/web/bible/search"
                       class="top-nav-search-button top-nav-btn btn btn-outline-secondary d-none"
                       role="button"
                       aria-label="본문 검색"
                       title="본문 검색">
                        🔍
                    </a>

                    <!-- Verse Font Size — verse-list 페이지에서만 노출 (useVerseFontBoot 플래그) -->
                    <div id="verseFontControl"
                         class="verse-font-control top-nav-font"
                         data-expanded="false"
                         th:if="${useVerseFontBoot}">
                        <button id="verseFontToggle"
                                type="button"
                                class="verse-font-toggle top-nav-btn btn btn-outline-secondary"
                                aria-expanded="false"
                                aria-controls="verseFontPanel"
                                aria-label="글씨 크기 조절 열기"
                                title="글씨 크기 조절">
                            <span aria-hidden="true">Aa</span>
                        </button>
                        <div id="verseFontPanel"
                             class="verse-font-panel d-none"
                             aria-hidden="true"
                             role="group"
                             aria-label="구절 글씨 크기 조절">
                            <div class="verse-font-stepper" role="radiogroup" aria-label="글씨 크기 단계 선택">
                                <button type="button" class="verse-font-dot" data-step="1" role="radio"
                                        aria-checked="false" tabindex="-1" aria-label="1단계 (가장 작게)">
                                    <span class="verse-font-dot-label" aria-hidden="true">Aa</span>
                                </button>
                                <button type="button" class="verse-font-dot" data-step="2" role="radio"
                                        aria-checked="false" tabindex="-1" aria-label="2단계 (작게)">
                                    <span class="verse-font-dot-label" aria-hidden="true">Aa</span>
                                </button>
                                <button type="button" class="verse-font-dot" data-step="3" role="radio"
                                        aria-checked="true"  tabindex="0"  aria-label="3단계 (기본)">
                                    <span class="verse-font-dot-label" aria-hidden="true">Aa</span>
                                </button>
                                <button type="button" class="verse-font-dot" data-step="4" role="radio"
                                        aria-checked="false" tabindex="-1" aria-label="4단계 (크게)">
                                    <span class="verse-font-dot-label" aria-hidden="true">Aa</span>
                                </button>
                                <button type="button" class="verse-font-dot" data-step="5" role="radio"
                                        aria-checked="false" tabindex="-1" aria-label="5단계 (가장 크게)">
                                    <span class="verse-font-dot-label" aria-hidden="true">Aa</span>
                                </button>
                            </div>

                            <button type="button" class="verse-font-reset" id="verseFontReset"
                                    disabled aria-label="기본 크기로 초기화">
                                <span class="verse-font-reset-label">초기화</span>
                                <span class="verse-font-reset-icon" aria-hidden="true">↺</span>
                            </button>
                            <button type="button" class="verse-font-close" id="verseFontClose"
                                    aria-label="글씨 크기 조절 닫기">×</button>

                            <span class="visually-hidden" aria-live="polite" id="verseFontLiveRegion"></span>
                        </div>
                    </div>

                    <button id="topNavNotificationButton"
                            type="button"
                            class="top-nav-notification-button top-nav-btn btn btn-outline-secondary d-none"
                            aria-label="알림"
                            title="알림"
                            disabled
                            th:data-show-notification="${showNotificationButton == true}">
                        🔔
                        <span id="topNavNotificationBadge" class="top-nav-notification-badge d-none"></span>
                    </button>
                    <div class="top-nav-account" th:if="${hideTopNavAccount != true}">
                        <button id="topNavAccountButton"
                                type="button"
                                class="top-nav-account-button top-nav-btn btn btn-outline-secondary"
                                aria-label="계정 메뉴"
                                aria-haspopup="true"
                                aria-expanded="false">
                            👤
                        </button>
                        <div id="topNavAccountMenu"
                             class="top-nav-account-menu d-none"
                             role="menu"
                             aria-label="계정 메뉴">
                            <button id="topNavThemeMenuToggle"
                                    type="button"
                                    class="top-nav-account-item top-nav-theme-menu-toggle"
                                    aria-haspopup="true"
                                    aria-expanded="false"
                                    aria-controls="topNavThemeSubmenu">
                                <span class="top-nav-theme-menu-label">테마</span>
                                <span class="top-nav-theme-menu-current" aria-hidden="true">☀️</span>
                                <span class="top-nav-theme-menu-chevron" aria-hidden="true">▾</span>
                            </button>
                            <div id="topNavThemeSubmenu"
                                 class="top-nav-theme-submenu"
                                 role="group"
                                 aria-label="테마 선택">
                                <button type="button"
                                        class="top-nav-account-item top-nav-theme-item"
                                        role="menuitemradio"
                                        data-theme-value="light"
                                        aria-checked="false"
                                        aria-label="라이트 모드">
                                    <span class="top-nav-theme-icon" aria-hidden="true">☀️</span>
                                    <span class="top-nav-theme-label">라이트</span>
                                    <span class="top-nav-theme-check" aria-hidden="true">✓</span>
                                </button>
                                <button type="button"
                                        class="top-nav-account-item top-nav-theme-item"
                                        role="menuitemradio"
                                        data-theme-value="dark"
                                        aria-checked="false"
                                        aria-label="다크 모드">
                                    <span class="top-nav-theme-icon" aria-hidden="true">🌙</span>
                                    <span class="top-nav-theme-label">다크</span>
                                    <span class="top-nav-theme-check" aria-hidden="true">✓</span>
                                </button>
                                <button type="button"
                                        class="top-nav-account-item top-nav-theme-item"
                                        role="menuitemradio"
                                        data-theme-value="system"
                                        aria-checked="false"
                                        aria-label="시스템 따름">
                                    <span class="top-nav-theme-icon" aria-hidden="true">🖥️</span>
                                    <span class="top-nav-theme-label">시스템</span>
                                    <span class="top-nav-theme-system-current" aria-hidden="true"></span>
                                    <span class="top-nav-theme-check" aria-hidden="true">✓</span>
                                </button>
                            </div>
                            <div class="top-nav-account-divider"
                                 role="separator"
                                 aria-orientation="horizontal"></div>
                            <a id="topNavLoginLink"
                               href="/web/auth/login"
                               class="top-nav-account-item d-none"
                               role="menuitem">
                                로그인
                            </a>
                            <a id="topNavMyPageLink"
                               href="/web/member/mypage"
                               class="top-nav-account-item d-none"
                               role="menuitem">
                                마이페이지
                            </a>
                            <a id="topNavMyMemoLink"
                               href="/web/member/my-memo"
                               class="top-nav-account-item d-none"
                               role="menuitem">
                                나의 성경 메모
                            </a>
                            <div id="topNavAccountDivider"
                                 class="top-nav-account-divider d-none"
                                 role="separator"
                                 aria-orientation="horizontal"></div>
                            <a id="topNavLogoutLink"
                               href="/web/auth/logout?returnUrl=/web/auth/login"
                               class="top-nav-account-item d-none"
                               role="menuitem">
                                로그아웃
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="top-nav-title">
            <div class="top-nav-title-inner container">
                <h1 id="pageTitleLabel"
                    class="page-title"
                    th:text="${#strings.isEmpty(pageTitle) ? '' : pageTitle}"
                    th:classappend="${(pageTitleVisible != null ? pageTitleVisible : !#strings.isEmpty(pageTitle)) ? '' : ' d-none'}"></h1>
            </div>
        </div>
    </nav>
    <script type="module">
        import {buildLoginRedirectUrl, checkAuthStatus} from "/js/auth/auth-check.js";

        document.addEventListener("DOMContentLoaded", () => {
            const loginLink = document.getElementById("topNavLoginLink");
            const logoutLink = document.getElementById("topNavLogoutLink");
            const myPageLink = document.getElementById("topNavMyPageLink");
            const myMemoLink = document.getElementById("topNavMyMemoLink");
            const accountDivider = document.getElementById("topNavAccountDivider");
            const accountButton = document.getElementById("topNavAccountButton");
            const accountMenu = document.getElementById("topNavAccountMenu");
            if (!loginLink || !logoutLink || !myPageLink || !myMemoLink || !accountDivider || !accountButton || !accountMenu) {
                return;
            }
            const returnUrl = `${window.location.pathname}${window.location.search}${window.location.hash}`;
            loginLink.href = buildLoginRedirectUrl(returnUrl);
            // 로그아웃 후에는 현재 페이지가 아니라 로그인 화면으로 이동시킨다.
            logoutLink.href = `/web/auth/logout?returnUrl=${encodeURIComponent("/web/auth/login")}`;

            const notificationButton = document.getElementById("topNavNotificationButton");

            checkAuthStatus({
                onAuthenticated: () => {
                    logoutLink.classList.remove("d-none");
                    myPageLink.classList.remove("d-none");
                    myMemoLink.classList.remove("d-none");
                    accountDivider.classList.remove("d-none");
                    if (notificationButton && notificationButton.dataset.showNotification === "true") {
                        notificationButton.classList.remove("d-none");
                    }
                },
                onUnauthenticated: () => {
                    loginLink.classList.remove("d-none");
                },
            });

            const closeAccountMenu = () => {
                accountMenu.classList.add("d-none");
                accountButton.setAttribute("aria-expanded", "false");
            };

            const openAccountMenu = () => {
                accountMenu.classList.remove("d-none");
                accountButton.setAttribute("aria-expanded", "true");
            };

            accountButton.addEventListener("click", () => {
                if (accountMenu.classList.contains("d-none")) {
                    openAccountMenu();
                } else {
                    closeAccountMenu();
                }
            });

            accountButton.addEventListener("keydown", (event) => {
                if (event.key === "ArrowDown") {
                    event.preventDefault();
                    openAccountMenu();
                    const firstItem = accountMenu.querySelector(".top-nav-account-item:not(.d-none)");
                    if (firstItem) {
                        firstItem.focus();
                    }
                }
            });

            accountMenu.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    event.preventDefault();
                    closeAccountMenu();
                    accountButton.focus();
                }
            });

            document.addEventListener("click", (event) => {
                if (!accountMenu.classList.contains("d-none") &&
                    !accountMenu.contains(event.target) &&
                    !accountButton.contains(event.target)) {
                    closeAccountMenu();
                }
            });
        });
    </script>
</header>
