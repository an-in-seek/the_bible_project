<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<!--
  단어 빈도 통계 다이얼로그 (설계 문서: docs/bible/word-frequency-design.md §10.2)
  사용법: 페이지 body 에 <div th:replace="~{fragments/word-stats-dialog :: wordStatsDialog}"></div> 포함 후,
         JS 에서 import {initWordStats} from "/js/bible/word-stats.js?v=1.0";

  Bootstrap JS 는 이 프로젝트에 없다. 네이티브 <dialog>.showModal() 로 연다.
-->
<dialog th:fragment="wordStatsDialog" id="wordStatsDialog" class="word-stats-dialog"
        aria-labelledby="wordStatsTitle">
    <div class="word-stats-header">
        <h5 id="wordStatsTitle" class="word-stats-title">단어 통계</h5>
        <button type="button" class="btn-close" id="wordStatsCloseBtn" aria-label="닫기"></button>
    </div>

    <div class="word-stats-body">
        <p id="wordStatsStatus" class="word-stats-status" role="status">불러오는 중…</p>

        <!-- 워드 클라우드: 장식 요소다. 실제 접근성 경로는 아래 목록이다. -->
        <div id="wordStatsCloudWrap" class="word-stats-cloud-wrap d-none">
            <svg id="wordStatsCloud" class="word-stats-cloud" role="img" aria-label="단어 워드클라우드"></svg>
        </div>

        <ul id="wordStatsList" class="word-stats-list" aria-label="단어 빈도 목록"></ul>
        <p id="wordStatsFootnote" class="word-stats-footnote d-none"></p>
    </div>

    <!-- 단어를 누르면 뜨는 작은 팝오버. 사전 뜻과 검색 이동을 제공한다. -->
    <div id="wordStatsPopover" class="word-stats-popover d-none" role="dialog" aria-label="단어 상세">
        <div class="word-stats-popover-head">
            <strong id="wordStatsPopoverTerm"></strong>
            <button type="button" class="btn-close btn-sm" id="wordStatsPopoverClose" aria-label="닫기"></button>
        </div>
        <p id="wordStatsPopoverDesc" class="word-stats-popover-desc"></p>
        <div class="word-stats-popover-actions">
            <a id="wordStatsPopoverDict" class="btn btn-sm btn-outline-secondary d-none" href="#">사전에서 보기</a>
            <a id="wordStatsPopoverSearch" class="btn btn-sm btn-primary" href="#">이 단어로 검색</a>
        </div>
    </div>
</dialog>
</body>
</html>
