spring:
  # GCP 비활성화 — 테스트 컨텍스트가 Application Default Credentials 없이 부팅되도록 함
  cloud:
    gcp:
      core:
        enabled: false
      logging:
        enabled: false
      trace:
        enabled: false

  # Security (OAuth, JWT 테스트용 최소 설정)
  security:
    oauth2:
      client:
        registration: { }   # OAuth 전부 비활성화
        provider: { }

  # 테스트용 DB (Testcontainers 사용 시 이 값들은 override 됨)
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/container
    username: user
    password: password

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        jdbc:
          time_zone: UTC

el-seeker:
  jwt:
    # Base64 정상 문자열 32바이트(256bit) 이상
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1pbnRlZ3JhdGlvbi10ZXN0LTEyMzQ=
    access-token-ttl: 1h
    refresh-token-ttl: 14d
  api:
    base-url: http://localhost:8080
    api-key: TEST_API_KEY
  # Apple 서버-대-서버 알림 검증용. private-key 는 알림 검증 경로에 쓰이지 않아 비워 둔다
  # (client_secret 생성은 AppleClientSecretGeneratorTest 가 자체 키로 따로 검증한다).
  apple:
    client-id: com.elseeker.test.service
    team-id: TEAMTEST01
    key-id: KEYTEST001
    private-key: ""
    # 알림의 aud 는 Services ID 가 아니라 primary App ID 로 온다
    notification-audiences: com.elseeker.test.app
    # 실제 Apple 서버 대신 WireMock 이 JWKS 를 내려준다 (IntegrationTest 의 @EnableWireMock)
    jwk-set-uri: ${test.apple.base-url}/auth/keys